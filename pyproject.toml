[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "bovista"
version = "0.1.0"
description = "High-performance 3D visualization library for scientific computing"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "aiohttp>=3.10.11",
    "fsspec>=2025.3.0",
    "numpy>=1.20",
    "PyQt6>=6.6",
    "requests>=2.32.4",
    "zarr>=3.0.8",  # v3 required for OME-Zarr 0.5 support
]

[tool.maturin]
# The pyo3 extension lives in its own workspace crate now (bovista-py). Its lib
# is named `bovista_py` to avoid colliding with the core `bovista` rlib; maturin
# renames the built artifact to the module name below, and the `#[pymodule]` fn
# is still `bovista`, so `import bovista` is unchanged.
manifest-path = "bovista-py/Cargo.toml"
module-name = "bovista"

[dependency-groups]
dev = [
    "maturin>=1.7",
]

[tool.uv]
# Cache keys for automatic Rust rebuilds — include shaders so uv rebuilds on .wgsl changes too
cache-keys = [
    {file = "Cargo.toml"},
    {file = "bovista-core/Cargo.toml"},
    {file = "bovista-py/Cargo.toml"},
    {file = "bovista-codegen/Cargo.toml"},
    {file = "bovista-core/build.rs"},
    {file = "bovista-core/src/**/*.rs"},
    {file = "bovista-core/src/**/*.wgsl"},
    {file = "bovista-py/src/**/*.rs"},
    {file = "bovista-codegen/src/**/*.rs"},
]
